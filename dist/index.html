<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="Clear Business Studies chapter notes, case-based practice and active recall for Chapters 1–8, 11 and 12.">
  <title>Business Studies · Revision room</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f8f6b'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='46' fill='white'%3Eb%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./data.js"></script>
  <script defer src="./data-more.js"></script>
  <script defer src="./data-rest.js"></script>
  <script defer src="./content-boost.js"></script>
  <script defer src="./content-boost-rest.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="rail-scrim" id="rail-scrim" aria-hidden="true"></div>
    <aside class="rail" id="rail" aria-label="Study navigation">
      <a class="brand" href="#" aria-label="Business Studies revision room">
        <span class="brand-mark" aria-hidden="true">b</span>
        <span class="brand-copy"><span class="brand-name">Revision room</span><span class="brand-subtitle">BUSINESS STUDIES · XII</span></span>
      </a>
      <div class="rail-label">STUDY MODE</div>
      <nav class="primary-nav" aria-label="Study modes">
        <button class="nav-item active" data-view="notes" aria-current="page"><span class="nav-dot" aria-hidden="true"></span><span class="nav-label">Chapter notes</span></button>
        <button class="nav-item" data-view="practice"><span class="nav-dot" aria-hidden="true"></span><span class="nav-label">Question bank</span><span class="nav-count" id="bank-count">—</span></button>
        <button class="nav-item" data-view="recall"><span class="nav-dot" aria-hidden="true"></span><span class="nav-label">Recall cards</span></button>
      </nav>
      <div class="rail-label chapter-label">CHAPTERS</div>
      <nav id="chapter-list" class="chapter-list" aria-label="Chapters"></nav>
      <div class="rail-bottom">
        <div class="progress-caption"><span>Recall mastered</span><strong id="progress-percent">0%</strong></div>
        <div class="progress-track" role="progressbar" aria-label="Recall cards mastered" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        <p id="progress-detail">Mark cards as known to track recall.</p>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-start">
          <button class="mobile-menu" id="mobile-menu" type="button" aria-controls="rail" aria-expanded="false">Menu</button>
          <div class="breadcrumb"><span>Business Studies</span><i aria-hidden="true">/</i><strong id="crumb">Chapter notes</strong></div>
        </div>
        <div class="top-actions"><button class="sprint-button" id="sprint-button" type="button">10-question sprint</button></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
      <footer class="site-footer"><span>Notes shaped from your chapter PDFs and school revision worksheets.</span><span>Understand the idea. <em>Spot the clue.</em></span></footer>
    </main>
  </div>
</body>
</html>
